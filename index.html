<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronómetro de Competencia</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="container">
        <h1>Cronómetro</h1>
        <div id="display">00:00:00.00</div>
        
        <div class="controls">
            <button id="startBtn">Iniciar</button>
            <button id="captureBtn" disabled>Capturar Tiempo</button>
            <button id="resetBtn">Reiniciar</button>
        </div>

        <table id="resultsTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Tiempo</th>
                    <th>Dif. con Primero</th>
                </tr>
            </thead>
            <tbody id="resultsBody">
                </tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
